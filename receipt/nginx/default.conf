# This is the default configuration for the Nginx reverse-proxy.
# This proxy will sit in front of Django and the Vite-based website.
# All API requests will be routed to Django and static requests to Vite.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    #Django
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    #Vite
    location / {
        try_files $uri $uri/ /index.html;
    }
}